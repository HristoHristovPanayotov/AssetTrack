# Local SQL Server for development inside WSL2 (works around Smart App Control,
# which only governs Windows binaries and does not touch Linux/containers).
#
# Start:  docker compose up -d
# Stop:   docker compose down           (data is kept in the named volume)
# Reset:  docker compose down -v        (deletes the database volume)
#
# The app connects with:
#   Server=localhost,1433;Database=AssetTrackDb;User Id=sa;Password=<below>;TrustServerCertificate=True
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: assettrack-sql
    environment:
      ACCEPT_EULA: "Y"
      # Change this; must meet SQL Server complexity rules (>=8 chars, upper, lower, digit, symbol).
      MSSQL_SA_PASSWORD: "Your_strong!Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - assettrack-mssql-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  assettrack-mssql-data:
